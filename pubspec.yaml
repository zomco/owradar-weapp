name: mmradar_app
description: "mmRadar 桌面助理客户端 —— 配网、实时看板、规则配置"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  cupertino_icons: ^1.0.9
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 只给测试用：伪造 WebSocketChannel 需要 StreamChannelMixin，
  # 而 web_socket_channel 没有把它再导出。
  stream_channel: ^2.1.4

flutter:
  uses-material-design: true
